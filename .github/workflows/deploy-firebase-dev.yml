name: Deploy TEXTPRINT to Firebase Hosting (Dev Channel)

on:
  push:
    branches: [dev]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build_and_deploy_dev:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci --legacy-peer-deps
          else
            npm install --legacy-peer-deps
          fi

      - name: Typecheck & Unit Tests
        run: npm run lint && npm test

      - name: Build static bundle
        run: npm run build

      - name: Verify Firebase service account secret is configured
        env:
          FIREBASE_SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_GEN_LANG_CLIENT_0224046879 }}
        run: |
          if [ -z "$FIREBASE_SA" ]; then
            echo "::error::Missing repository secret FIREBASE_SERVICE_ACCOUNT_GEN_LANG_CLIENT_0224046879. Add it in GitHub Settings -> Secrets and variables -> Actions."
            exit 1
          fi

      - name: Deploy to Firebase Hosting Dev Channel
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_GEN_LANG_CLIENT_0224046879 }}
          projectId: gen-lang-client-0224046879
          channelId: dev
          expires: 30d
